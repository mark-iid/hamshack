# kb3lyb-sway baked foot defaults. foot is the interim terminal until ghostty
# (DESIGN §2) is layered from a vetted COPR. foot is Wayland-native and sharp at
# fractional scale (DESIGN §4). System fallback; real config via stow.
font=monospace:size=11
dpi-aware=yes

[cursor]
blink=yes

[colors]
alpha=0.96
background=1a1b26
foreground=c0caf5
