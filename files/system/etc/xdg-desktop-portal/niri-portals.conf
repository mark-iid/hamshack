# kb3lyb-sway portal routing for the niri session (DESIGN §6).
#
# Overrides the stock /usr/share/xdg-desktop-portal/niri-portals.conf, whose
# `default=gnome;gtk` sends the FileChooser (and other UI portals) to
# xdg-desktop-portal-gnome FIRST. Under niri there is no GNOME session, so
# xdg-desktop-portal-gnome's FileChooser delegation fails ("The name is not
# activatable") and the CALLING app hangs on an open/save dialog that never
# appears (seen with the Nextcloud desktop client: "Choose a different folder"
# did nothing, then the app froze).
#
# Prefer the GTK backend, which implements FileChooser and every other UI portal
# and works on wlroots compositors; keep screencast/screenshot on the wlroots
# backend and secrets on gnome-keyring. Dark mode still flows through the GTK
# Settings portal (reads org.gnome.desktop.interface color-scheme).
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Secret=gnome-keyring
