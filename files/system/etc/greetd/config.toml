# kb3lyb-sway greeter (DESIGN §2: greetd + tuigreet).
# The session command is /usr/bin/kb3lyb-greeter, a thin wrapper that paints the
# whole VT Norton blue (redefines console palette color 0) and then execs tuigreet
# with the Norton Utilities palette (blue field, light-cyan borders, light-yellow
# highlights, white text) to match the KB3LYB / markearnest.net presentation style.
# tuigreet launches `niri --session` — niri as a proper session (imports env, brings
# up graphical-session.target) so pipewire/portals/user services come up correctly.
#
# The big login font comes from /etc/vconsole.conf (latarcyrheb-sun32), not here.
#
# LOGIN-CRITICAL: a bad greetd command breaks login. The wrapper's color step is
# guarded and `exec tuigreet` is unconditional, but verify on the machine after
# upgrading and roll back to the previous deployment from the boot menu if it fails.

[terminal]
vt = 1

[default_session]
command = "/usr/bin/kb3lyb-greeter"
user = "greetd"
