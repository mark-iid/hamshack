# kb3lyb-sway (DESIGN §8). Stage upgrades in the background so they are ready to
# apply on the next boot. Paired with rpm-ostreed-automatic.timer (enabled in the
# recipe), and with kb3lyb-reboot-when-idle.timer, which supplies the reboot half
# that this policy deliberately leaves to "other automation tools" — but only
# while nobody is logged in (DESIGN §8.2).
#
# NOT AutomaticUpdatePolicy=apply: that one "will currently always initiate a
# reboot", session or no session. Rebases to a new Fedora are still manual (§5/§8.1).
[Daemon]
AutomaticUpdatePolicy=stage
