# Pinned GIDs — the single source of truth for every group whose number gets
# stamped into a file inside /usr at image build time.
#
# THE BUG THIS EXISTS TO PREVENT. A chgrp records a NUMBER, not a name. These
# groups are all declared `g <name> -` by their own packages, i.e. dynamically
# allocated, and systemd-sysusers hands out dynamic system GIDs counting DOWN
# from 999 in whatever order groups happen to be created. The build container and
# an already-installed machine create them in different orders, so they get
# different numbers — and /etc/group persists across a rebase, so adding a new
# group-owning package to the image makes the machine allocate it locally at a
# number the image never used.
#
# Observed on 2026-08-22, all three at once:
#
#     group        in the image     on the laptop
#     kismet       958              960
#     rtlsdr       959              958
#     wireshark    956              957
#
# So /usr/bin/kismet_cap_linux_wifi was 4750 root:958 — group `kismet` as far as
# the build was concerned, group `rtlsdr` as far as the laptop was concerned — and
# a user in `kismet` could not execute it. /usr/bin/dumpcap had the same problem
# against `wireshark`, silently breaking non-root packet capture. Both had been
# "hardened" successfully and made unusable at the same time, with a green build.
#
# Pinning makes the two agree. Numbers are from the LOW end of the dynamic system
# range (201-999); allocation counts down from 999, so collisions here are about
# as unlikely as this range gets. Verified free in both databases when chosen.
#
# ADDING TO THIS FILE: anything that ends up owning a file under /usr belongs
# here. files/scripts/pin-gids.sh reads this file and reconciles the build
# container against it, and image-assert.sh warns at build time about any dynamic
# GID owning /usr files that is not listed.
g kismet    350
g wireshark 351
g rtlsdr    352
g mosquitto 353
g usbmon    354
