# Seed system flatpak overrides into /var on boot (DESIGN §4: force the Electron
# apps onto native Wayland for sharp HiDPI). Baking directly into /var doesn't
# persist on ostree/bootc, so these `C` rules copy the seed from
# /usr/share/factory/var/... into /var only if the target doesn't already exist —
# leaving any later `flatpak override` edits by the user untouched.
#
# NOTE the consequence of `C` for the two security-motivated overrides below
# (bitwarden's !x11, teams' !home): copy-if-absent means a machine that already
# has the file keeps its old copy forever. Tightening a permission here reaches
# a FRESH install automatically, but an existing machine needs the equivalent
# `sudo flatpak override --system …` run by hand — see SETUP §6.
d /var/lib/flatpak/overrides 0755 root root - -
C /var/lib/flatpak/overrides/com.slack.Slack 0644 root root - -
C /var/lib/flatpak/overrides/com.bitwarden.desktop 0644 root root - -
C /var/lib/flatpak/overrides/com.github.IsmaelMartinez.teams_for_linux 0644 root root - -
C /var/lib/flatpak/overrides/org.mozilla.firefox 0644 root root - -
C /var/lib/flatpak/overrides/io.github.ungoogled_software.ungoogled_chromium 0644 root root - -
#
# DELIBERATELY NO com.discordapp.Discord LINE. An override on Discord — even just
# `sockets=wayland;fallback-x11;` with no environment block — makes its renderer
# segfault in a loop: the "Discord Updater" splash maps and the main window never
# does. Bisected on the live machine (no override works, sockets-only breaks it,
# full override breaks it, and applying the same override to a known-good install
# reproduces the break).
#
# The override bought nothing anyway: with none at all Discord still runs on
# --ozone-platform=wayland, because its own wrapper selects Wayland when the
# socket is present. The Electron HiDPI nudge the other apps need is redundant
# here.
#
# This is almost certainly the "zypak breaks the splash->main-window handoff
# under niri" bug that got Discord installed as a native tarball in the first
# place. It was never zypak — it was this file.
