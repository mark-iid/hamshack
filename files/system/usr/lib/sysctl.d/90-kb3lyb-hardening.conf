# kb3lyb-sway kernel hardening.
#
# Lives in /usr/lib/sysctl.d (image-owned), not /etc — same rationale as the
# tmpfiles.d and bootc/kargs.d drop-ins next to it. The 90- prefix sorts after
# Fedora's own /usr/lib/sysctl.d/10-default-yama-scope.conf, so these win; a
# machine-local /etc/sysctl.d file would still override them if ever needed.

# Restrict ptrace to parent->child (Yama level 1). Fedora ships 0, which lets ANY
# process running as the desktop user attach to any other and read its memory —
# the rbw agent while the vault is unlocked, gnome-keyring-daemon, ssh-agent, a
# browser. That turns one compromised unsandboxed $HOME app (brew binaries,
# JetBrains, the native Discord client) into full credential loss. This matters
# more than usual here because the login keyring is stored with a blank password
# (SETUP §6), so keyring contents have no protection beyond file ownership.
#
# Level 1, not 2/3: 1 keeps normal parent->child debugging working (gdb/strace on
# something you launched, perf on your own tree), which is what a dev laptop
# needs. Debuggers that attach to an already-running PID need
# `sudo sysctl kernel.yama.ptrace_scope=0` for the session, or run under sudo.
kernel.yama.ptrace_scope = 1

# Hide kernel pointers from unprivileged reads of /proc and friends, so a local
# exploit can't cheaply defeat KASLR. Pairs with the dmesg_restrict=1 the base
# already sets.
kernel.kptr_restrict = 1
