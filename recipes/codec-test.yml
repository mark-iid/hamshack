---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# The codec module ALONE, to confirm it depsolves on the pinned Fedora before it
# is entangled with everything else. Along with ham-test.yml this is one of the
# two standalone smoke tests, and they cover the two modules a Fedora version bump
# is actually likely to break (see DESIGN §"What breaks on a version bump").
#
#     ./build-local.sh recipes/codec-test.yml     # tag derived from this file
#
# Worth stating what this CANNOT prove: it runs in a container with no GPU, so it
# verifies that intel-media-driver installs, not that the iHD driver initialises
# on the real UHD 630. That check is `vainfo` on the machine — see SETUP §6.
name: kb3lyb-codec-test
description: codec depsolve smoke test

base-image: quay.io/fedora-ostree-desktops/sway-atomic
image-version: 44

modules:
  - from-file: common/codecs.yml
