---
# The ham radio stack. Kept out of recipe.yml and behind `from-file:` for the same
# reason codecs.yml is: it is the part of this image most likely to break on a
# Fedora version bump, and it is the part worth depsolving on its own before it is
# entangled with a compositor and a desktop. recipes/ham-test.yml builds exactly
# this module and nothing else:
#
#     ./build-local.sh recipes/ham-test.yml
#
# Package availability was verified against Fedora 44 on 2026-08-25 by repoquery
# in a clean fedora:44 container, not from memory. Fedora's ham packaging is much
# better than its reputation — of everything below, only three items needed
# out-of-repo handling, and they are isolated at the bottom of this file.
modules:
  # ---------------------------------------------------------------- native RPMs
  - type: dnf
    install:
      # EXCLUDES — 900 MB of weak dependencies that nothing here actually needs.
      # Measured on the first full build, not guessed:
      #
      #   proj-data-*  764 MB of regional cartographic datum grids (US alone is
      #                319 MB; the rest is the UK, South Africa, Australia,
      #                Canada, Germany, Denmark, Japan, New Zealand...). They
      #                arrive because xastir and sdrangel pull `proj`, and the
      #                grid packages Recommend it back. But those two only ever
      #                require `libproj.so.25` — the LIBRARY. Checked with
      #                `rpm -q --requires`. The grids are for survey-grade datum
      #                transformation; APRS mapping does not touch them.
      #                proj-data (base, 10 MB) is NOT excluded — the glob needs
      #                the trailing hyphen, so it does not match.
      #
      #   dosbox-staging + fluid-soundfont-gm  158 MB, including a 142 MB General
      #                MIDI soundfont, on a ham radio PC. A weak dep several hops
      #                out from the wine/audio stack.
      #
      # If something later turns out to need a specific grid, add that ONE package
      # back rather than deleting the glob.
      exclude:
        - proj-data-*
        - dosbox-staging
        - fluid-soundfont-gm
      packages:
        # -- rig control -------------------------------------------------------
        # hamlib ships rigctl/rigctld/rotctl in the MAIN package; there is no
        # hamlib-utils subpackage in Fedora (checked — the name does not exist).
        # rigctld is the hub nearly everything else here talks CAT through, so a
        # single daemon owns the serial port instead of six apps fighting over it.
        - hamlib
        - flrig                    # GUI rig control; also serves an XML-RPC CAT
                                   # endpoint fldigi/WSJT-X can share

        # -- weak signal digital ----------------------------------------------
        - wsjtx                    # FT8/FT4/JT65/WSPR
        - js8call                  # JS8 keyboard-to-keyboard
        # GridTracker is NOT here. It is packaged nowhere — not Fedora, not RPM
        # Fusion, not Flathub (all three checked 2026-08-25). Upstream ships an
        # NW.js tarball/AppImage aimed at $HOME. That makes it a dotfiles-bootstrap
        # item under the same rule that keeps brew and SDKMAN out of this image,
        # not something to bake. See DESIGN §6.

        # -- fldigi suite ------------------------------------------------------
        - fldigi                   # the modem: PSK31, RTTY, Olivia, MFSK, ...
        - flmsg                    # ICS/ARES forms over fldigi
        - flamp                    # file transfer over fldigi
        # flwrap is NOT in Fedora 44 (checked). Not worth an external repo.
        - qsstv                    # SSTV / DSSTV

        # -- packet / APRS / Winlink -------------------------------------------
        - direwolf                 # software TNC (AX.25, APRS, KISS)
        - ax25-tools               # AX.25 kernel stack userland
        - ax25-apps
        - libax25
        - xastir                   # APRS mapping
        # Pat (Winlink) is installed further down — Go binary, no RPM anywhere.

        # -- SDR ---------------------------------------------------------------
        - rtl-sdr                  # librtlsdr + rtl_test/rtl_fm + the udev rules
        - SoapySDR                 # vendor-neutral SDR abstraction
        - soapy-rtlsdr             # Soapy <-> RTL bridge (this is the module name;
                                   # `soapysdr-module-rtlsdr` does not exist here)
        - soapy-airspyhf
        - gqrx                     # general-purpose receiver
        - sdrpp                    # SDR++
        - sdrangel                 # multi-mode SDR workbench
        - rtl-433                  # 433 MHz ISM decoder
        # sdrtrunk is installed further down — Java, no RPM anywhere.

        # -- logging / awards --------------------------------------------------
        # QLog is THE logger for this machine, not a suggestion: it is what the
        # Windows install already runs (0.50.0), it is Qt and cross-platform, and
        # Fedora 44 carries 0.52.0 — a NEWER build than the one being migrated
        # from. Its on-disk format is SQLite + ADIF, so the move is an import, not
        # a conversion. Checked 2026-08-25.
        - qlog
        # CQRLOG IS DELIBERATELY ABSENT — do not add it back without a reason.
        # It hard-depends on mariadb-server (~78 MiB installed) because it keeps
        # its log in a local MySQL instance, so adding it means running a database
        # daemon on a shack PC for a logger that is not even the primary one.
        # QLog above is the primary. Dropped by decision, 2026-08-25.
        - klog                     # lighter second logger / ADIF wrangler
        - trustedqsl               # LoTW signing. The BINARY is `tqsl`; the
                                   # PACKAGE is `trustedqsl`. Asking dnf for
                                   # `tqsl` fails.

        # -- radio programming -------------------------------------------------
        # CHIRP. THE GUI IS IN A SUBPACKAGE. Plain `chirp` installs /usr/bin/chirpc
        # (CLI) and nothing else — the wxPython GUI at /usr/bin/chirp is owned by
        # `chirp+wx`. This is the single easiest mistake to make in this file: the
        # build stays green and the machine has no CHIRP window.
        - chirp+wx

        # -- satellites / misc -------------------------------------------------
        - gpredict                 # satellite tracking + doppler, drives rotctld
        - tlf                       # contest logger (curses)

        # -- serial / USB plumbing --------------------------------------------
        # Nearly every radio interface on this desk is a USB serial bridge; these
        # are the ones whose absence shows up as "the radio just does not appear".
        - picocom                  # first thing to reach for on a CAT port
        - minicom                  # heavier alternative when picocom is not enough
        - setserial
        - usbutils                 # lsusb, for the same reason

  # ------------------------------------------------------------------- Wine
  # For the RT Systems radio programmers, which are Windows-only paid apps that
  # drive a USB serial cable. This is the least certain thing in the image and is
  # deliberately called out rather than buried:
  #
  #   * Wine's serial support works by symlinking a host tty into the prefix's
  #     dosdevices (ln -s /dev/ttyUSB0 ~/.wine/dosdevices/com1). It is fine for
  #     plain reads/writes and historically weak on control-line games (DTR/RTS
  #     toggling, non-standard baud rates) — which is exactly what a radio cloning
  #     cable does. Whether a given RT Systems title works is a per-title question
  #     that cannot be answered from here.
  #   * RT Systems cables are usually FTDI or Prolific; the kernel driver is the
  #     easy half. Getting the app to see COM1 is the half that fails.
  #   * If a title turns out not to work under Wine, the honest answer is a small
  #     Windows VM with USB passthrough, not more Wine tuning. Do not let this
  #     package list imply the problem is solved — it is not yet tested.
  #
  # WINE, WITHOUT THE 32-BIT MULTILIB STACK — and that is not the limitation it
  # sounds like. Read this before adding wine-core.i686 back.
  #
  # Fedora 44's wine-core.x86_64 ships the new-WoW64 layout. Verified by rpm -ql
  # inside the built image, 2026-08-25:
  #
  #     wine-core.x86_64  ->  wine/i386-windows   (827 32-bit PE DLLs)
  #                           wine/x86_64-unix    (64-bit host loader)
  #     wine-core.i686    ->  wine/i386-unix      (32-bit host loader)
  #
  # So the 64-bit package ALONE runs 32-bit Windows binaries — the PE side is
  # 32-bit and the unix side is 64-bit. That is what new WoW64 is. Dropping the
  # i686 package does NOT remove 32-bit support; it removes the CLASSIC 32-bit
  # host loader, which matters only for apps needing genuinely native 32-bit host
  # libraries (32-bit OpenGL being the usual example) or that hit a new-WoW64 gap.
  #
  # It was carried briefly as insurance and measured: 186 i686 packages, 1.23 GB.
  #
  # IT WAS ADDED BACK ON 2026-08-26 AND REMOVED AGAIN ON 2026-08-27, having been
  # measured rather than argued about. The sequence, because the order is the whole
  # lesson:
  #
  #   1. Every 32-bit PE failed outright — SELinux `execmod` denied on lib_t. That
  #      is a composefs property, not a Wine one, and i686 does NOT fix it. The fix
  #      is the policy module in selinux/kb3lyb-wine32.te (SETUP §6.8). This was the
  #      only real problem, and it was never about packaging.
  #   2. With that fixed, the DRCS25 installer still died in
  #      `err:seh:call_seh_handlers invalid frame`. i686 was added to enable a
  #      WINEARCH=win32 prefix as a way around the WoW64 exception path.
  #   3. That did not work either — in a win32 prefix the installer exits earlier
  #      and more silently than before. The win32 route made things WORSE.
  #   4. VARA HF then installed and ran perfectly in an ORDINARY win64 prefix with
  #      plain `wine` (SETUP §6.9). Fedora's Wine is new-WoW64: it runs 32-bit
  #      Windows apps in a 64-bit prefix, and `WINEARCH=win32` is neither needed nor
  #      supported. The advice that sent us down that path was a Pat wiki page
  #      predating new-WoW64.
  #   5. RT Systems' remaining progress came from winxp compatibility mode, not from
  #      architecture.
  #
  # So nothing on this machine needs the classic 32-bit loader. Both live prefixes
  # (VARA, and the RT Systems one) are win64 driven by plain `wine`. Removing it
  # returns ~186 packages / ~1.23 GB — real money on a 256 GB disk holding two
  # deployments.
  #
  # DO NOT add it back to fix "32-bit does not work". That symptom is §6.8's SELinux
  # module, every time. Add it back only if something genuinely requires a
  # WINEARCH=win32 prefix, and say in the commit what that thing is.
  - type: dnf
    install:
      exclude:
        - dosbox-staging
        - fluid-soundfont-gm
      packages:
        - wine
        - winetricks

  # ------------------------------------------- out-of-repo: sdrtrunk and Pat
  # Two things this stack needs that are packaged nowhere. Both are installed by
  # scripts into /opt and /usr/bin with a PINNED VERSION AND SHA256, so a build is
  # reproducible and picking up a new upstream release is an explicit edit that
  # shows in a diff — never a silent "whatever :latest happens to be today".
  #
  # This is the same instinct as pinning the GitHub action to a SHA rather than a
  # tag: these fetch code over the network into the image at build time, and the
  # image is signed afterwards. An unpinned fetch means the signature attests to
  # something nobody chose.
  - type: script
    scripts:
      - install-sdrtrunk.sh
      - install-pat.sh
      # ardopcf: the NATIVE ARDOP soundcard modem for Pat/Winlink. Deliberately
      # alongside VARA rather than instead of it — VARA is Windows-only and needs
      # Wine, ardopcf does not, so this is the fallback that cannot break when a
      # Wine prefix does. Packaged nowhere for Fedora; upstream ships a prebuilt
      # x86_64 binary. See install-ardopcf.sh for the pinning rationale.
      - install-ardopcf.sh
